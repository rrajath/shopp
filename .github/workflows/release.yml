name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compute next version code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_COUNT=$(gh release list --repo "${{ github.repository }}" --limit 1000 | wc -l | tr -d ' ')
          VERSION_CODE=$((RELEASE_COUNT + 1))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Determine release tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
            echo "RELEASE_TAG=v${VERSION_NAME}-${VERSION_CODE}" >> "$GITHUB_ENV"
          fi

      - name: Decode release keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/shopp-release.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=app/keystore/shopp-release.jks
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon -PVERSION_CODE=${{ env.VERSION_CODE }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --title "$RELEASE_TAG" \
            --generate-notes
